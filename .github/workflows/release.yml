name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        # The daemon test runs the real `tethera` helper, which `swift test` doesn't build itself.
        run: |
          swift build --product tethera-cli
          swift test

      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Checksum and signature
        # The updater only offers releases with a signature. Sign here if the key is configured
        # as a secret; otherwise scripts/sign_release.sh signs from the maintainer's Mac afterwards.
        env:
          TETHERA_UPDATE_KEY: ${{ secrets.TETHERA_UPDATE_KEY }}
        run: |
          cd dist
          shasum -a 256 Tethera-macOS.dmg > Tethera-macOS.dmg.sha256
          if [ -n "$TETHERA_UPDATE_KEY" ]; then
            swift ../scripts/sign_update.swift sign Tethera-macOS.dmg > Tethera-macOS.dmg.sig
          fi

      - name: Release notes
        run: |
          NOTES=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$RUNNER_TEMP/notes.md"
            echo 'Install with `curl -fsSL https://tsogbat.github.io/tethera/install.sh | bash`, or download **Tethera-macOS.dmg** below.' > "$NOTES"
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Tethera ${{ github.ref_name }}
          body_path: ${{ env.NOTES }}
          files: |
            dist/Tethera-macOS.dmg
            dist/Tethera-macOS.dmg.sha256
            dist/Tethera-macOS.dmg.sig
          fail_on_unmatched_files: false
